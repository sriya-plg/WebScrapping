# Calix x Estes: site mechanics + normalization. Shared Calix settings (pending API, payload keys) are in ../../client.yaml
code: ESTES
name: Estes Express
aliases: [EXLA]
browser: {provider: playwright_stealth, headless: true}
limits: {max_concurrency: 1, min_delay_s: 3, max_delay_s: 8}   # site-safe defaults; clients may override
block_markers: []
adapter:                       # VERIFY every selector/regex below against DevTools (Network tab)
  transport: browser           # or: http  (open JSON endpoint, no browser)
  tracking_page: https://www.estes-express.com/myestes/shipment-tracking/
  input_selector: "input[name='searchValue']"
  submit_selector: "button[type='submit']"
  ref_type_select: null
  ref_type_map: {PRO: PRO, BOL: BOL}
  response_regex: "shipment-tracking/.*(search|track|details)"
  http_url_template: "https://www.estes-express.com/api/tracking/{ref}"   # VERIFY / only for transport: http
  not_found_if_empty: "shipment"
normalize:                     # paths assume the fixture shape in tests/fixtures/estes_response.json
  fields:
    status: "shipment.status"
    pickup_date: "shipment.pickupDate"
    delivery_date: "shipment.deliveryDate"
    eta: "shipment.appointmentDate"
    origin: "shipment.origin"
    destination: "shipment.destination"
    pieces: "shipment.pieces"
    weight: "shipment.weight"
  status_map:
    delivered: DELIVERED
    "in transit": IN_TRANSIT
    "out for delivery": OUT_FOR_DELIVERY
    "picked up": PICKED_UP
  events:
    path: history
    fields: {timestamp: date, description: description, location: location, status: status}
