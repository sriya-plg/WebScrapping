# Calix x Estes. Everything here is OPTIONAL: with no overrides the engine uses the backend trackingUrl,
# auto-detects the search box + the JSON call, and auto-maps common fields.
# Run `python scripts/probe.py calix estes <PRO>` and pin what you verified, so a site change can't silently re-map.
aliases: [EXLA, ESTE03]
