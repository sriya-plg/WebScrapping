# Calix x Estes Express (MyEstes shipment tracking)
#
# Public UI: textarea + yellow SEARCH. Guest tracking often shows HTML errors without
# cloudapi JSON; not_found_markers avoids false TimeoutError when PROs are invalid.
# Verify with a known-good 10-digit PRO: python scripts/probe.py calix estes <PRO> --headed

aliases: [EXLA, ESTE03]

browser:
  browser_mode: playwright_stealth
  headless: false

limits:
  max_concurrency: 1
  min_delay_s: 4
  max_delay_s: 11
  retries: 3

site:
  tracking_url: https://www.estes-express.com/myestes/shipment-tracking/
  input_selector: "textarea:visible"
  submit_selector: 'button:has-text("SEARCH")'

  input_mode: multiline
  delimiter: "\n"
  # Max PRO lines entered in the textarea before one SEARCH click (Estes allows ~20).
  batch_size: 20

  response_url_pattern: '(?i)(myestes-api\.estes-express\.com/shipmenttracking/history|cloudapi\.estes-express\.com/v1/shipments|shipments/history)'
  expected_response_shape: per_pro
  response_pro_path: data[].pro

  strip_spaces_dashes: true
  strip_leading_zeros: false

  response_timeout_s: 25
  idle_window_s: 2
  typing_delay_ms: 0
  pre_submit_delay_s: 3
  inter_batch_delay_s: 2
  action_min_delay_s: 0.5
  action_max_delay_s: 1.2

  extra:
    # Per-carrier batch flow (see saia/estes mapping.yaml; BatchScraper reads site.extra only).
    landing_settle_s: 3
    pro_input_digits: 10
    retry_missing_individually: false
    batch_collect_all_responses: true
    return_to_tracking_after_submit: true
    response_match_loose_json: true
    response_data_path: data
    response_error_code_path: error.code
    response_error_message_path: error.message
    response_not_found_codes: [50010]
    input_selector_fallbacks:
      - 'textarea[placeholder*="tracking numbers" i]'
      - '#trackingNumbers'
    not_found_markers:
      - "Not found or tracking information unavailable"
    consent_selectors:
      - "#onetrust-accept-btn-handler"
      - "button:has-text('Accept')"

  login: null

mapping:
  auto: true
  fields:
    reference: data.0.pro
    status: data.0.status.expandedStatus|data.0.status.conciseStatus|shipment.status
    pickup_date: data.0.pickupDate|shipment.pickupDate
    delivery_date: data.0.deliveryDate|shipment.deliveryDate
    eta: data.0.estimatedDelivery.endDate|shipment.eta
    origin: data.0.shipper.address.city|shipment.origin
    destination: data.0.consignee.address.city|shipment.destination
    pieces: data.0.piecesCount|shipment.pieces
    weight: data.0.totalWeight|shipment.weight
    service_level: data.0.serviceLevel|data.0.service|shipment.serviceLevel
    # receivedBy is the POD signature; driver name is the fallback.
    pod_name: data.0.receivedBy|data.0.driverInfo.name|data.0.podName|data.0.signedBy|data.0.delivery.signedBy
    pod_datetime: data.0.deliveryDate|data.0.podDateTime|shipment.deliveryDate
  compose:
    # deliveryDate + deliveryTime (offset kept, later converted to UTC Z).
    pod_datetime: "{data.0.deliveryDate}T{data.0.deliveryTime}"
  events:
    # One event per statusHistory scan. Parent movement supplies code, location, and coordinates.
    path: data.0.movementHistory|history
    explode: statusHistory
    fields:
      timestamp: date|referenceDate
      description: movementHistory.description|description
      location: location.name|location
      status: conciseStatus|expandedStatus|status
      code: transportEventTypeCode|conciseStatus|code|status
      timezone: timezone|tz
      # Estes geoCoordinates is [longitude, latitude].
      lat: location.geoCoordinates.1|latitude|lat
      long: location.geoCoordinates.0|longitude|lng|long
    compose:
      timestamp: "{referenceDate}T{referenceTime}"
    assign:
      - if: id=Pickup
        set:
          lat: data.0.originTerminal.geoCoordinates.1
          long: data.0.originTerminal.geoCoordinates.0
      - if: id=Delivery
        set:
          lat: data.0.destinationTerminal.geoCoordinates.1
          long: data.0.destinationTerminal.geoCoordinates.0
  status_map:
    Delivered: DELIVERED
    "Delivery Completed - OK": DELIVERED
    "Out for Delivery": OUT_FOR_DELIVERY
    "In Transit": IN_TRANSIT
    "Picked Up": PICKED_UP
