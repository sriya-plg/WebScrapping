# Calix x Forward Air (public tracking at forwardair.com/tracking)
#
# UI: MUI tag field (#fwrd-tracking-tags) — up to 10 waybills per search; API is one GET with
# comma-separated numbers. Verify: python scripts/probe.py calix forwardair <8-digit-pro> --headed

aliases: [FWDA, FORW-LTL]

browser:
  provider: patchright
  browser_mode: patchright
  headless: false
  channel: chrome

limits:
  max_concurrency: 1
  min_delay_s: 4
  max_delay_s: 11
  retries: 2

site:
  tracking_url: https://www.forwardair.com/tracking
  input_selector: "#fwrd-tracking-tags"
  submit_selector: 'button.trk-shp-btn:has-text("Track Shipments")'

  input_mode: delimited
  delimiter: ","
  batch_size: 10

  response_url_pattern: '(?i)api-prod\.forwardair\.com/tracking/shipments'
  response_regex: '(?i)api-prod\.forwardair\.com/tracking/shipments'
  expected_response_shape: single_batch
  response_pro_path: results[].AirbillNumber

  strip_spaces_dashes: true
  strip_leading_zeros: false

  response_timeout_s: 45
  idle_window_s: 2
  pre_submit_delay_s: 0.8
  inter_pro_delay_s: 0.15
  action_min_delay_s: 0.6
  action_max_delay_s: 1.5

  login: null
  match_ref: true

  extra:
    landing_settle_s: 2
    tag_input_enter: true
    skip_tracking_input_verify: true
    submit_force_click: true
    retry_missing_individually: false
    batch_collect_all_responses: true
    return_to_tracking_after_submit: true
    single_batch_array_path: results
    single_batch_item_pro_path: AirbillNumber
    response_data_path: results
    consent_selectors:
      - "#onetrust-reject-all-handler"
      - "#onetrust-accept-btn-handler"

activity:
  preserve_event_offsets: true
  preserve_pod_datetime: true
  payload_map:
    pieces: pieces
  events_map:
    timezone: timezone
    airportCode: location

mapping:
  auto: true
  fields:
    reference: AirbillNumber
    status: CurrentStatusDescription
    delivery_date: PodDate|EstimatedAvailableDate
    eta: EstimatedAvailableDate|EstimatedDeliveryRange
    origin: originName|Origin
    destination: destinationName|Destination
    pieces: Pieces
    weight: Weight
    service_level: ServiceLevel|Service
    # PodSignedBy -> podName. AirbillNumber -> reference (Calix housebill stays the pending-order id).
    pod_name: PodSignedBy|PodName|SignedBy|Signature
    pod_datetime: PodDate
  events:
    path: Statuses
    preserve_offset: true
    fields:
      status: StatusDescription
      timestamp: RecordDate
      location: AirportCode
      airportCode: AirportCode
      description: StatusDescription
      code: statusCode|StatusCode|StatusDescription
      timezone: TimeZoneCode|Timezone|tz
      lat: Latitude|lat
      long: Longitude|lng|long
  status_map:
    Delivered: DELIVERED
    Recovered: DELIVERED
    Invoiced: IN_TRANSIT
    "Picked Up": PICKED_UP
    "Out for delivery": OUT_FOR_DELIVERY
    "Out for Delivery": OUT_FOR_DELIVERY
    "In Transit": IN_TRANSIT
    Cancelled: IN_TRANSIT
