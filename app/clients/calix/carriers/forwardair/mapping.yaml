# Calix x Forward Air.
aliases: [FWDA, FORW-LTL]
browser:
  provider: patchright
  browser_mode: patchright
  headless: false
  channel: chrome
site:
  tracking_url: "https://www.forwardair.com/tracking"
  # TODO: verify selectors and response contract from browser network capture.
  input_selector: "TODO_REPLACE_TRACKING_INPUT"
  submit_selector: "TODO_REPLACE_SEARCH_BUTTON"
  input_mode: delimited
  delimiter: ","
  batch_size: 10
  response_url_pattern: "TODO_REPLACE_TRACKING_API_PATTERN"
  expected_response_shape: single_batch
  response_pro_path: "TODO_REPLACE_JSON_PATH_TO_PRO"
  strip_spaces_dashes: true
  strip_leading_zeros: false
  response_timeout_s: 45
  idle_window_s: 2
  action_min_delay_s: 0.6
  action_max_delay_s: 1.5
  login: null
  match_ref: true
  extra:
    consent_selectors:
      - "#onetrust-reject-all-handler"

fields:
  status: "results.0.CurrentStatusDescription"
  delivery_date: "results.0.PodDate"
  eta: "results.0.EstimatedAvailableDate"
  origin: "results.0.originName"
  destination: "results.0.destinationName"
  pieces: "results.0.Pieces"
  weight: "results.0.Weight"

status_map:
  "Invoiced": "IN_TRANSIT"
  "Delivered": "DELIVERED"
  "Picked Up": "PICKED_UP"
  "Out for delivery": "OUT_FOR_DELIVERY"

events:
  path: "results.0.Statuses"
  fields:
    status: "StatusDescription"
    timestamp: "RecordDate"
    location: "AirportCode"
    description: "StatusDescription"
