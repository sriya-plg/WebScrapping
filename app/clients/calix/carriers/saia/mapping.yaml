# Calix x Saia. Needs adapter.py for Cloudflare and reCAPTCHA handling; mapping works like any other carrier.
aliases: [SAIA_LTL, SAI001]
browser:
  provider: patchright         # undetected-first; fall back to crawl4ai only if this gets blocked
  headless: false              # run under xvfb on a server; headed passes Cloudflare far more often
  channel: chrome
limits: {max_concurrency: 1, min_delay_s: 8, max_delay_s: 20, retries: 2, breaker_threshold: 3, breaker_cooldown_s: 3600}
block_markers: ["just a moment", "verify you are human", "attention required"]
site:
  challenge_wait_s: 60
  tracking_url: "https://www.saia.com/track"
  input_selector: "#trackingNumbers"
  submit_selector: "button.track-button"
  response_regex: "/api/v1/tracking/find-by-pro-number"
  match_ref: true

fields:
  reference: "[0].referenceNumbers.proNumber"
  status: "[0].shipment.status"
  pickup_date: "[0].shipment.pickupDate"
  delivery_date: "[0].delivery.deliveredDate"
  eta: "[0].delivery.expectedDate"
  origin: "[0].shipper.companyName"
  destination: "[0].consignee.companyName"

status_map:
  "Delivered": "DELIVERED"
  "In Transit": "IN_TRANSIT"
  "Out for Delivery": "OUT_FOR_DELIVERY"
  "Picked Up": "PICKED_UP"
