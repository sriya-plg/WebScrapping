# Calix x Saia
#
# How mapping works (all carriers, including future ones):
#   1. site.response_url_*   capture the carrier's network JSON (prefer the complete API)
#   2. mapping.fields/events  carrier JSON -> TrackingResult  (edit dotted paths here)
#   3. client.yaml activity.* TrackingResult + ctx -> AddCarrierActivity
# Use `|` for first-non-empty fallbacks so find-full-details and find-by-pro can share one map.
# `=literal` in activity.payload_map pins a constant (see client.yaml).

aliases: [SAIA_LTL, SAI001]

browser:
  browser_mode: patchright
  headless: false
  channel: chrome

limits:
  max_concurrency: 1
  min_delay_s: 8
  max_delay_s: 20
  retries: 2
  breaker_threshold: 3
  breaker_cooldown_s: 3600

block_markers:
  - just a moment
  - verify you are human
  - attention required

site:
  tracking_url: https://www.saia.com/track
  challenge_wait_s: 60

  input_selector: "#trackingNumbers"
  submit_selector: 'button[aria-label="Track your shipment now"]'
  input_mode: multiline
  delimiter: "\n"
  batch_size: 30

  # Capture both APIs; prefer the complete payload when the page also calls it.
  response_url_pattern: '(?i)/api/v1/tracking/(find-full-details?|find-by-pro-number)'
  response_url_prefer: find-full-detail
  expected_response_shape: single_batch
  response_pro_path: "[].referenceNumbers.proNumber"
  strip_spaces_dashes: true
  extra:
    # Saia UI: enter 11-digit PROs (drop the 12th check digit from the backend value).
    pro_input_digits: 11
    retry_missing_individually: false
    single_batch_unmatched_is_not_found: true
    return_to_tracking_after_submit: true
    batch_collect_all_responses: true
    single_batch_item_pro_path: referenceNumbers.proNumber
    landing_settle_s: 2.5

  response_timeout_s: 45
  idle_window_s: 2
  typing_delay_ms: 75
  inter_pro_delay_s: 1.0
  pre_submit_delay_s: 2.5
  inter_batch_delay_s: 4.0
  action_min_delay_s: 1.0
  action_max_delay_s: 2.5

  login:
    enabled: false
    required: false
    url: https://www.saia.com/track
    open_selector: 'a[aria-label="Log in"]'
    selectors:
      username: "#loginUsername"
      password: "#loginPassword"
      submit: "form button[type='submit']:has-text('LOGIN')"
      success: "TODO_REPLACE_LOGGED_IN_SELECTOR"

mapping:
  auto: true
  fields:
    reference: "referenceNumbers.proNumber|[0].referenceNumbers.proNumber"
    status: "shipment.status|[0].shipment.status"
    pickup_date: "shipment.pickupDate|[0].shipment.pickupDate"
    delivery_date: "delivery.deliveredDate|[0].delivery.deliveredDate"
    eta: "delivery.expectedDate|[0].delivery.expectedDate"
    origin: "shipper.companyName|[0].shipper.companyName|shipper.address.city"
    destination: "consignee.companyName|[0].consignee.companyName|consignee.address.city"
    pieces: "shipment.pieces|[0].shipment.pieces"
    weight: "shipment.weight|[0].shipment.weight"
    service_level: "shipment.serviceLevel|shipment.service|[0].shipment.serviceLevel"
    pod_name: "delivery.signedBy|delivery.podName|delivery.signature|[0].delivery.signedBy"
    pod_datetime: "delivery.deliveredDate|delivery.podDateTime|[0].delivery.deliveredDate"
  events:
    path: "history|trackingHistory|statusHistory|events|[0].history"
    fields:
      timestamp: date|eventDate|eventDateTime|datetime|timestamp
      description: description|statusDescription|activity
      location: city|location
      status: status|statusDescription
      code: statusCode|code|status
      timezone: timezone|tz
      lat: latitude|lat
      long: longitude|lng|long
  status_map:
    Delivered: DELIVERED
    "Delivery Completed - OK": DELIVERED
    "Delivery Completed": DELIVERED
    In Transit: IN_TRANSIT
    Out for Delivery: OUT_FOR_DELIVERY
    Picked Up: PICKED_UP
