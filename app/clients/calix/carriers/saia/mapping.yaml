# Calix x Saia. Scrapling-based DOM extraction; adapter.py handles Cloudflare and reCAPTCHA.
aliases: [SAIA_LTL]
browser:
  provider: patchright         # undetected-first; fall back to crawl4ai only if this gets blocked
  headless: false              # run under xvfb on a server; headed passes Cloudflare far more often
  channel: chrome
limits: {max_concurrency: 1, min_delay_s: 8, max_delay_s: 20, retries: 2, breaker_threshold: 3, breaker_cooldown_s: 3600}
block_markers: ["just a moment", "verify you are human", "attention required"]
site:
  challenge_wait_s: 60
  tracking_url: "https://www.saia.com/track"
  input_selector: "#trackingNumbers"
  submit_selector: "button.track-button"
  result_selector: "#trackingResults"
  not_found_selector: "td.no-pro-found"
  response_timeout_s: 30
  settle_s: 0.5

scraping:
  strategy: scrapling
  container_selector: "#trackingResults"
  row_selector: "tr.pro-to-track"
  not_found_selector: "td.no-pro-found"
  fields:
    reference: "td:nth-of-type(1)"
    status: "td:nth-of-type(2)"
    pickup_date: "td:nth-of-type(3)"
    eta: "td:nth-of-type(4)"
    delivery_date: "td:nth-of-type(5)"
    delivery_window: "td:nth-of-type(6)"
    consignee: "td:nth-of-type(7)"

fields:
  reference: "reference"
  status: "status"
  pickup_date: "pickup_date"
  delivery_date: "delivery_date"
  eta: "eta"
  destination: "destination|consignee"
  delivery_window: "delivery_window"

status_map:
  "Delivered": "DELIVERED"
  "In Transit": "IN_TRANSIT"
  "Out for Delivery": "OUT_FOR_DELIVERY"
  "Picked Up": "PICKED_UP"
