# Calix x Saia: site mechanics + normalization. Shared Calix settings are in ../../client.yaml
code: SAIA
name: Saia LTL
aliases: [SAIA_LTL]
browser:
  provider: patchright         # undetected-first (per plan); fall back to crawl4ai only if this gets blocked
  headless: false              # run under xvfb on the server; headed passes Cloudflare far more often
  channel: chrome
  persist_state: true
limits: {max_concurrency: 1, min_delay_s: 8, max_delay_s: 20, retries: 2, breaker_threshold: 3, breaker_cooldown_s: 3600}
block_markers: ["just a moment", "verify you are human", "attention required"]
adapter:                       # VERIFY against the live site
  tracking_page: https://www.saia.com/track
  challenge_wait_s: 60
  login_required: false
  input_selector: "input[name='proNumber']"
  submit_selector: "button[type='submit']"
  response_regex: "/api/.*(track|shipment)"
  not_found_if_empty: "shipment"
normalize:
  fields:
    status: "shipment.status"
    delivery_date: "shipment.deliveryDate"
    eta: "shipment.appointmentDate"
    origin: "shipment.origin"
    destination: "shipment.destination"
    pieces: "shipment.pieces"
    weight: "shipment.weight"
  status_map: {delivered: DELIVERED, "in transit": IN_TRANSIT, "out for delivery": OUT_FOR_DELIVERY}
  events: {path: history, fields: {timestamp: date, description: description, location: location}}
