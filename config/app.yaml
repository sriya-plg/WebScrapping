log_level: INFO
state_db: state/tracker.db
state_dir: state/browser
clients_dir: app/clients
schedule: {interval_minutes: 360, jitter_minutes: 25, seed: tracker}
alerts: {webhook_url: null, dedupe_hours: 6}   # Teams/Slack incoming webhook
backend:
  mode: file            # switch to http once the API is live
  base_url: https://backend.example.com/api
  token_env: TRACKER_API_TOKEN
  carriers_path: /carriers
  post_path: /tracking/bulk
  stub_dir: stub
  outbox_dir: out
carrier_configuration:
  enabled: false                 # enable explicitly for the live carrier configuration API
  base_url: https://plgtst.pegasuslogistics.com/api/orderentry
  configurations_path: /GetCarrierConfigurationDetails
  shipments_path: /GetCarrierShipmentDetails
  shipments_method: GET
  shipments_get_json_body: true   # supplied contract implies GET + JSON body; confirm with API owner
  timeout_s: 30
  retries: 3
