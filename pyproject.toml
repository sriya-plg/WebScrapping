[project]
name = "webscrapping"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "httpx>=0.28.1",
    "patchright>=1.63.0",
    "playwright>=1.63.0",
    "playwright-stealth>=2.0.3",
    "pydantic>=2.13.5",
    "pyyaml>=6.0.3",
    "scrapling>=0.4.15",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests"]

